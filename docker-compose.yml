services:
  postgres:
    image: postgres:18
    container_name: tuhorario-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      # Desde postgres 18 el volumen se monta en /var/lib/postgresql
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
